name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend-ci:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./backend-ci.db
      POSTGRES_DSN: sqlite:///./backend-ci.db
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run lint
        run: python -m ruff check .
      - name: Validate migration graph
        run: python scripts/validate_migrations.py
      - name: Run performance envelope
        run: python -m pytest -q tests/test_performance_envelope.py
      - name: Validate hosted production configuration
        env:
          APP_ENV: production
          HOSTED_SERVERLESS: "true"
          STARTUP_INVARIANTS_ENABLED: "false"
          JWT_SECRET: this-is-a-ci-validation-secret-with-32-chars
          PLATFORM_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PUBLIC_BASE_URL: https://ci.example.com
          POSTGRES_DSN: postgresql://user:pass@db.example.com:6543/app?sslmode=require
          CELERY_TASK_ALWAYS_EAGER: "true"
          CELERY_TASK_EAGER_PROPAGATES: "true"
        run: python scripts/validate_production_config.py
