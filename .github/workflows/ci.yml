name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db
      POSTGRES_DSN: sqlite:///./ci.db
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate migrations
        run: python scripts/validate_migrations.py
      - name: Run backend tests
        run: python -m pytest -q

  automation-conformance:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./automation-ci.db
      POSTGRES_DSN: sqlite:///./automation-ci.db
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate automation contracts
        run: >-
          python -m pytest -q
          tests/test_automation_command_migration.py
          tests/test_automation_command_openapi.py
          tests/test_automation_commands.py
          tests/test_automation_conformance.py
          tests/test_automation_export.py
          tests/test_automation_manual_lock_enforcement.py
          tests/test_automation_manual_lock.py
          tests/test_automation_observability_hooks.py
          tests/test_automation_provider_setup.py
          tests/test_automation_recipe_catalog.py
          tests/test_automation_timeline_api.py
          tests/test_automation_webhook_delivery.py
          tests/test_automation_webhook_fanout.py
          tests/test_automation_webhook_migration.py
          tests/test_external_automation_contract.py
          tests/test_strategy_automation_loop.py

  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lsos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lsos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/lsos_test
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@localhost:5432/lsos_test
      DATABASE_RLS_ENABLED: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate PostgreSQL tenant isolation
        run: >-
          python -m pytest -vv --tb=short --maxfail=1
          tests/integration/test_rls_isolation.py
          tests/integration/test_ai_visibility_security.py
          tests/integration/test_usage_credit_migration.py
          tests/integration/test_billing_webhook_concurrency.py
          tests/integration/test_active_location_allowance_concurrency.py
          tests/integration/test_governed_ai_provider_benchmark_security.py

  deterministic-replay-gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./replay-ci.db
      POSTGRES_DSN: sqlite:///./replay-ci.db
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      BASELINE_MANIFEST_SHA256: "146adaa9cc23efffe02041855c5addf2cd55637646cdea4474ba6372e1c42118"
    steps:
      - uses: actions/checkout@v4
      - name: Detect replay-sensitive changes
        id: replay_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            replay_required:
              - 'backend/app/services/strategy_engine/**'
              - 'backend/app/services/intelligence_service.py'
              - 'backend/app/services/**/*readiness*.py'
              - 'backend/app/services/**/*threshold*.py'
              - 'backend/app/core/**/*threshold*.py'
              - 'backend/app/core/alert_thresholds.py'
              - 'backend/app/models/intelligence.py'
              - 'backend/app/governance/replay/**'
              - 'backend/scripts/replay/**'
              - 'backend/app/testing/fixtures/replay_corpus/**'
              - 'backend/artifacts/replay/baseline/v1/**'
              - 'backend/artifacts/replay/baseline/v2/**'
            baseline_locked:
              - 'backend/artifacts/replay/baseline/v1/**'
              - 'backend/artifacts/replay/baseline/v2/**'
      - uses: actions/setup-python@v5
        if: steps.replay_changes.outputs.replay_required == 'true' || steps.replay_changes.outputs.baseline_locked == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify baseline manifest
        if: steps.replay_changes.outputs.replay_required == 'true' || steps.replay_changes.outputs.baseline_locked == 'true'
        run: >-
          python scripts/replay/verify_baseline_manifest_hash.py
          --manifest artifacts/replay/baseline/v2/manifest.json
          --expected-sha256 $env:BASELINE_MANIFEST_SHA256
      - name: Install backend requirements
        if: steps.replay_changes.outputs.replay_required == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate migrations
        if: steps.replay_changes.outputs.replay_required == 'true'
        run: python scripts/validate_migrations.py
      - name: Run deterministic replay
        if: steps.replay_changes.outputs.replay_required == 'true'
        run: >-
          python scripts/replay/run_replay.py
          --manifest app/testing/fixtures/replay_corpus/v2/manifest.json
          --report artifacts/replay/ci/replay_report.json
          --executor app.governance.replay.executor_strategy_engine:execute_case
      - name: Enforce baseline immutability
        if: steps.replay_changes.outputs.baseline_locked == 'true'
        run: throw "Replay baseline artifacts are immutable."
      - name: Replay gate not required
        if: steps.replay_changes.outputs.replay_required != 'true' && steps.replay_changes.outputs.baseline_locked != 'true'
        run: Write-Host "Replay-sensitive paths unchanged; skipping deterministic replay gate."

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
