name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db
      POSTGRES_DSN: sqlite:///./ci.db
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate migrations
        run: python scripts/validate_migrations.py
      - name: Run backend tests
        run: python -m pytest -q

  deterministic-replay-gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./replay-ci.db
      POSTGRES_DSN: sqlite:///./replay-ci.db
      TZ: UTC
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      BASELINE_MANIFEST_SHA256: "146adaa9cc23efffe02041855c5addf2cd55637646cdea4474ba6372e1c42118"
    steps:
      - uses: actions/checkout@v4
      - name: Detect replay-sensitive changes
        id: replay_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            replay_required:
              - 'backend/app/services/strategy_engine/**'
              - 'backend/app/services/intelligence_service.py'
              - 'backend/app/services/**/*readiness*.py'
              - 'backend/app/services/**/*threshold*.py'
              - 'backend/app/core/**/*threshold*.py'
              - 'backend/app/core/alert_thresholds.py'
              - 'backend/app/models/intelligence.py'
              - 'backend/app/governance/replay/**'
              - 'backend/scripts/replay/**'
              - 'backend/app/testing/fixtures/replay_corpus/**'
              - 'backend/artifacts/replay/baseline/v1/**'
              - 'backend/artifacts/replay/baseline/v2/**'
            baseline_locked:
              - 'backend/artifacts/replay/baseline/v1/**'
              - 'backend/artifacts/replay/baseline/v2/**'
      - uses: actions/setup-python@v5
        if: steps.replay_changes.outputs.replay_required == 'true' || steps.replay_changes.outputs.baseline_locked == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify baseline manifest
        if: steps.replay_changes.outputs.replay_required == 'true' || steps.replay_changes.outputs.baseline_locked == 'true'
        run: >-
          python scripts/replay/verify_baseline_manifest_hash.py
          --manifest artifacts/replay/baseline/v2/manifest.json
          --expected-sha256 $env:BASELINE_MANIFEST_SHA256
      - name: Install backend requirements
        if: steps.replay_changes.outputs.replay_required == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate migrations
        if: steps.replay_changes.outputs.replay_required == 'true'
        run: python scripts/validate_migrations.py
      - name: Run deterministic replay
        if: steps.replay_changes.outputs.replay_required == 'true'
        run: >-
          python scripts/replay/run_replay.py
          --manifest app/testing/fixtures/replay_corpus/v2/manifest.json
          --report artifacts/replay/ci/replay_report.json
          --executor app.governance.replay.executor_strategy_engine:execute_case
      - name: Enforce baseline immutability
        if: steps.replay_changes.outputs.baseline_locked == 'true'
        run: throw "Replay baseline artifacts are immutable."
      - name: Replay gate not required
        if: steps.replay_changes.outputs.replay_required != 'true' && steps.replay_changes.outputs.baseline_locked != 'true'
        run: Write-Host "Replay-sensitive paths unchanged; skipping deterministic replay gate."

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
